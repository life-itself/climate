# The ledger. One entry per unit of work, each with an explicit `passes`.
#
# Never edit this file to make a goal pass. If something cannot meet the gate,
# leave `passes: false` and record why in `reason`.
#
# `human: true` marks work that cannot be done from the repo — it needs a person.
#
# Plan: docs/plans/2026-08-07-climate-kb-migration.md

meta:
  checker_baseline_errors: 443
  current_errors: 0
  migration_complete: true
  # Completed 2026-08-08. The one entry below that is not `passes: true` is a
  # decision, not outstanding work: gh-pages is kept on purpose. Follow-on
  # content and infrastructure work is tracked in GitHub issues #39, #40, #41
  # under the epic #37, not here.
  # climate.lifeitself.org verified live 2026-08-08: pages 200, bad route 404,
  # assets served (PNG is a real 116KB image, so the LFS bug is fixed in prod),
  # legacy chapter URLs 308 to withouthotair.org, typo redirect works, GA
  # G-PV1VZND295 loading, favicon/nav/hero/footer all present.
  # withouthotair.org verified live 2026-08-08 (via --resolve; the local
  # resolver was still caching the earlier NXDOMAIN): /, /about and chapters
  # 200, unknown route 404, chapter titles correct, no raw span markup, and
  # climate.lifeitself.org/without-hot-air/chap01 completes to a 200.
  # Note: its A records are Cloudflare proxy IPs (188.114.96.2/97.2), not the
  # Vercel address Flowershow's docs specify - see the review queue.
  # 443 errors against the target structure on the pre-migration tree, at commit
  # e7547a1. Expected: the checker gates the target layout, not today's. This
  # number should fall monotonically as tasks land. It is a progress signal, not
  # a gate.

features:
  - id: checker-baseline
    task: 1
    description: scripts/check.mjs + tests + verify.sh + init.sh, 14/14 tests green
    passes: true

  - id: house-rules
    task: 2
    description: CLAUDE.md, docs/features.yaml, docs/review-queue.md
    passes: true

  - id: site-teardown
    task: 3
    description: tag pre-flowershow, delete site/, workflow and .gitattributes
    passes: true
    notes:
      # Facts that only exist inside site/ and must survive its deletion.
      analytics: G-PV1VZND295
      old_site_title: Life Itself Climate Inquiry
      cname: climate.lifeitself.org
      tracked_symlinks_removed_with_site:
        - site/public/assets -> ../../assets
        - site/public/img/without-hot-air -> ../../../without-hot-air/Images

  - id: content-flatten
    task: 4
    description: content/*.md to repo root, home.md -> index.md, degress -> degrees
    passes: true
    notes:
      redirect_debt:
        - from: /ipcc-special-report-1.5-degress-2018
          to: /ipcc-special-report-1.5-degrees-2018

  - id: stop-hook
    task: 5
    description: .claude/settings.json Stop hook running scripts/verify.sh
    passes: true
    notes:
      # Wired after the flatten, once verify.sh could actually exit 0.

  - id: notes-split
    task: 6
    description: split notes.md into one file per note
    passes: true

  - id: asset-normalisation
    task: 7
    description: normalise image paths to /assets, kebab-case filenames, rewrite
      the 389 /img/without-hot-air/... references
    passes: true

  - id: lfs-removal
    task: 7
    description: no Git LFS pointers remain in the tree
    passes: true
    notes:
      # All five assets/ PNGs are LFS pointers in the index AND working tree, and
      # are broken in production (the live site serves the 131-byte pointer with
      # Content-Type image/png). git-lfs is not installed here. Objects confirmed
      # still present in GitHub LFS storage and retrievable via the batch API with
      # curl + a gh token — recipe in the plan, task 7 step 1.
      broken_in_production: true
      objects_recoverable: true

  - id: chart-port
    task: 8
    description: replace the dead VegaLite chart with Flowershow LineChart and
      supply the HadCRUT5 CSV
    passes: true

  - id: wikilink-conversion
    task: 9
    description: internal markdown links converted to wikilinks
    passes: true

  - id: wha-repo-split
    task: 10
    description: full-history clone refactored into a standalone without-hot-air repo
    passes: true

  - id: wha-config
    task: 10
    description: config.json for the without-hot-air site
    passes: true

  - id: chapter-redirects
    task: 11
    description: one permanent redirect per chapter to withouthotair.org
    passes: true

  - id: climate-config
    task: 11
    description: config.json for the climate site
    passes: true

  - id: wha-repo-create
    task: 12
    description: gh repo create life-itself/without-hot-air --public, then push
    passes: true
    human: true

  - id: flowershow-connect-climate
    task: 13
    description: connect life-itself/climate as a Flowershow site
    passes: true
    human: true

  - id: flowershow-connect-wha
    task: 13
    description: connect life-itself/without-hot-air as a Flowershow site
    passes: true
    human: true

  - id: dns-climate
    task: 13
    description: climate.lifeitself.org CNAME to Flowershow
    passes: true
